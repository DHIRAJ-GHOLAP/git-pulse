[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-pulse"
version = "0.1.0"
description = "Modern Git analytics & developer productivity dashboard for your terminal"
readme = "README.md"
authors = [
    { name = "Dhiraj Gholap", email = "dhirajgholap@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "git",
    "cli",
    "terminal",
    "analytics",
    "developer-tools",
    "heatmap",
    "churn",
    "changelog",
    "productivity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Utilities"
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
git-pulse = "git_pulse.cli:main"

[project.urls]
Homepage = "https://github.com/DHIRAJ-GHOLAP/git-pulse"
Repository = "https://github.com/DHIRAJ-GHOLAP/git-pulse.git"
Issues = "https://github.com/DHIRAJ-GHOLAP/git-pulse/issues"

[tool.hatch.build.targets.wheel]
packages = ["git_pulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
